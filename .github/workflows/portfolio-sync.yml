name: Portfolio queue worker
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions: {}
concurrency:
  group: portfolio-queue
  cancel-in-progress: false
jobs:
  process:
    if: vars.PORTFOLIO_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Drain a bounded batch
        env:
          PORTFOLIO_URL: ${{ secrets.PORTFOLIO_URL }}
          CRON_SECRET: ${{ secrets.PORTFOLIO_CRON_SECRET }}
        run: |
          node --input-type=module <<'JS'
          const base = new URL(process.env.PORTFOLIO_URL);
          if (base.protocol !== 'https:') throw new Error('HTTPS required');
          for (let i = 0; i < 5; i++) {
            const response = await fetch(new URL('/api/cron?mode=work', base), {
              headers: { Authorization: `Bearer ${process.env.CRON_SECRET}` },
              redirect: 'error', signal: AbortSignal.timeout(65000)
            });
            if (!response.ok) throw new Error(`Worker returned ${response.status}`);
            const result = await response.json();
            console.log(`Worker: ${result.status}`);
            if (result.status === 'idle' || result.status === 'error') break;
          }
          JS
